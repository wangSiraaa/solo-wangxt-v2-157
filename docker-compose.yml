# Local development / acceptance stack: PostgreSQL plus the sandbox API.
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://sandbox:sandbox@postgres:5432/sandbox
      SANDBOX_MAX_MEMORY_MIB: "16"
      SANDBOX_MAX_FUEL: "10000000"
      SANDBOX_MAX_OUTPUT_KB: "64"
      SANDBOX_TIMEOUT_MS: "10000"
      MAX_CONCURRENT_EXECS: "64"
      RUST_LOG: info,wasm_plugin_sandbox=info
    ports:
      - "8080:8080"

volumes:
  pgdata:
