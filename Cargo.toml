[package]
name = "wasm-plugin-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Multi-tenant third-party Wasm compute plugin API (Axum + Wasmtime + PostgreSQL)"
license = "MIT"

[[bin]]
name = "wasm-plugin-sandbox"
path = "src/main.rs"

[dependencies]
# "tokio" feature gates axum::serve; without it serve/connect_info are absent.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# chrono feature supplies TIMESTAMPTZ decode/encode.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "chrono"] }
wasmtime = { version = "24", default-features = false, features = ["cranelift", "runtime", "parallel-compilation"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["json", "ansi", "env-filter"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
parking_lot = "0.12"
# Same anyhow version wasmtime re-exports; used for host-function traps.
anyhow = "1"
socket2 = "0.5"

[dev-dependencies]
wat = "1"

[profile.release]
lto = "thin"
codegen-units = 1
